[project]
name = "voicelm"
version = "0.1.0"
description = "Privacy-first, voice-first personal knowledge workspace — AI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.1.0",
    "httpx2>=2.13.0",
    "pypdf>=5.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.12",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.19.1",
    "rapidocr-onnxruntime>=1.4.4",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.32",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2025.1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
voicelm = "voicelm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicelm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
